name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set project links
        env:
          LIVE_PORTAL_URL: ${{ vars.LIVE_PORTAL_URL }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          portal = os.environ['LIVE_PORTAL_URL'].strip()
          if portal:
              url = urlsplit(portal)
              if url.scheme != 'https' or not url.hostname or url.username or url.password:
                  raise SystemExit('LIVE_PORTAL_URL must be an HTTPS URL without credentials.')

          index = Path('site/index.html')
          page = index.read_text(encoding='utf-8')
          repository = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          links = {'deka-repository': repository, 'deka-portal': portal}
          for name, value in links.items():
              placeholder = f'name="{name}" content=""'
              if page.count(placeholder) != 1:
                  raise SystemExit(f'Expected one {name} placeholder.')
              page = page.replace(placeholder, f'name="{name}" content="{html.escape(value, quote=True)}"')
          index.write_text(page, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4